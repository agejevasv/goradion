name: Rust

on:
  push:
    branches: [rust-rewrite]
    # A rust-v tag publishes a pre-release; plain v tags stay with the Go release.
    tags: ['rust-v*']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml']
  # New advisories appear without any change here.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  checks:
    name: just check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Rust
      run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

    - name: ALSA headers
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - uses: taiki-e/install-action@v2
      with:
        tool: just,cargo-deny,cargo-machete

    - run: just check

  build:
    name: ${{ matrix.target }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu runners, as a Linux binary needs a glibc at least as
        # new as the one it was built with.
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: linux-amd64, test: true}
          - {os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: linux-arm64, test: true}
          - {os: macos-latest, target: aarch64-apple-darwin, asset: darwin-arm64, test: true}
          - {os: macos-latest, target: x86_64-apple-darwin, asset: darwin-amd64, test: false}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-amd64, test: true}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Rust
      run: rustup toolchain install stable --profile minimal --component clippy --target ${{ matrix.target }} && rustup default stable

    - name: ALSA headers
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Clippy
      if: matrix.test
      run: cargo clippy --release --target ${{ matrix.target }} -- -D warnings

    - name: Test
      if: matrix.test
      run: cargo test --release --target ${{ matrix.target }}

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    # .cargo/config.toml links the C runtime in; a clean Windows lacks its DLLs.
    - name: No C runtime DLLs
      if: runner.os == 'Windows'
      run: |
        dumpbin -dependents target/${{ matrix.target }}/release/goradion.exe | tee dlls.txt
        ! grep -iE 'vcruntime|msvcp|api-ms-win-crt' dlls.txt

    - uses: actions/upload-artifact@v4
      with:
        name: goradion-${{ matrix.asset }}
        path: rust/target/${{ matrix.target }}/release/goradion${{ runner.os == 'Windows' && '.exe' || '' }}

  release:
    name: Pre-release
    if: startsWith(github.ref, 'refs/tags/rust-v')
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    # goradion-linux-amd64 and so on, as the Go releases name them.
    - name: Name the binaries
      run: |
        mkdir dist
        for dir in artifacts/goradion-*; do
          for f in "$dir"/*; do
            ext=""
            [[ $f == *.exe ]] && ext=.exe
            cp "$f" "dist/${dir#artifacts/}$ext"
          done
        done
        chmod +x dist/*
        (cd dist && sha256sum -- * > SHA256SUMS)
        ls -l dist

    - uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        generate_release_notes: true
        files: dist/*
