name: Rust

on:
  push:
    branches: [rust-rewrite]
  pull_request:
    paths: ['rust/**', 'internal/radio/remote.html', '.github/workflows/rust.yml']
  # New advisories appear without any change here.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  checks:
    name: just check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Rust
      run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

    - name: ALSA headers
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - uses: taiki-e/install-action@v2
      with:
        tool: just,cargo-deny,cargo-machete

    - run: just check

  build:
    name: ${{ matrix.target }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, test: true}
          - {os: macos-latest, target: aarch64-apple-darwin, test: true}
          - {os: macos-latest, target: x86_64-apple-darwin, test: false}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, test: true}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Rust
      run: rustup toolchain install stable --profile minimal --component clippy --target ${{ matrix.target }} && rustup default stable

    - name: ALSA headers
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Clippy
      if: matrix.test
      run: cargo clippy --release --target ${{ matrix.target }} -- -D warnings

    - name: Test
      if: matrix.test
      run: cargo test --release --target ${{ matrix.target }}

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    # .cargo/config.toml links the C runtime in; a clean Windows lacks its DLLs.
    - name: No C runtime DLLs
      if: runner.os == 'Windows'
      run: |
        dumpbin -dependents target/${{ matrix.target }}/release/goradion.exe | tee dlls.txt
        ! grep -iE 'vcruntime|msvcp|api-ms-win-crt' dlls.txt

    - uses: actions/upload-artifact@v4
      with:
        name: goradion-${{ matrix.target }}
        path: rust/target/${{ matrix.target }}/release/goradion${{ runner.os == 'Windows' && '.exe' || '' }}
