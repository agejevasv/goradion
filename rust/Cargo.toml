[package]
name = "goradion"
version = "0.11.0"
edition = "2024"
license = "Unlicense"
# The newest minimum among the dependencies (ratatui, time); `just msrv` checks it.
rust-version = "1.88"

[dependencies]
audioadapter-buffers = "5.2"
cpal = "0.18.2"
csv = "1.4.0"
opus-rs = "0.1.34"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
ratatui = "0.30.2"
rtrb = "0.4.0"
rubato = "5.0.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "flac", "ogg", "vorbis", "id3v2"] }
tiny_http = { version = "0.12.0", default-features = false }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
webpki-roots = "1.0.9"

[profile.release]
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Audio and layout maths convert between sample, cell and time units on
# purpose; the values are small and known.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The themes are hex colours, as their palettes publish them.
unreadable_literal = "allow"
# Durations read as "15 * 60" seconds; from_mins needs Rust 1.91.
duration_suboptimal_units = "allow"
# Short names for the theme and glyphs (t, g) and coordinates (x, y, w).
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A program, not a library: nothing outside calls these functions.
must_use_candidate = "allow"
